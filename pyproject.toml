[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-risk-intelligence"
version = "2.1.0"
description = "Customer churn risk intelligence API and ML pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bibek Dhakal" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "joblib",
    "pandera",
    "mlflow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "skops"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "matplotlib",
    "seaborn",
    "jinja2"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
